org:
  projectfile:
    build:
      args:
        B19_JAVA_DISTRO: temurin
        B19_JAVA_BUILD_IMAGE: ""
    ci:
      secrets:
        f5m.i2p.site-eepsite-key:
          docker:
            image: self
            run: generate-eepsite-key
    images:
      B19_JAVA_BUILD_IMAGE:
        org: b19
        name: java
        distro: $${B19_JAVA_DISTRO}
        series: $${B19_JAVA_SERIES}
        path: ${org}/${name}
        flatpath: ${org}-${name}
        tag: $${M6E_BASE_IMAGE_VARIANT_PREFIX}${distro}-${series}
        registry: B19_DOCKER_REGISTRY
        ref: $${B19_DOCKER_REGISTRY}/${path}:${tag}
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/f5m-i2p.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/f5m/i2p.git
