  title: F5M / I2P
  description:
    en: I2P anonymous-network router with console, HTTP proxy and eepsite hosting, plus baked-in reseed and subscription presets for bootstrapping.
    es: Router de la red anónima I2P con consola, proxy HTTP y hosting de eepsites, más presets de reseed y suscripciones para el arranque.
    uk: Маршрутизатор анонімної мережі I2P з консоллю, HTTP-проксі й хостингом eepsite, плюс вбудовані пресети reseed і підписок для старту.
