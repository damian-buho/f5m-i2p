          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:ro
      - name: restore osv-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/osv-db
          key: ci-cache-osv-db-
          restore-keys: |
            ci-cache-osv-db-
      - name: osv-scanner-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ env.M6E_TAG }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
          mounts: ${{ runner.temp }}/ci-cache/osv-db:/app/.cache/osv:ro
      - name: restore trivy-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:ro
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  source-is-tested:
    runs-on: ubuntu-latest
    steps:
      - run: echo source-is-tested
  source-passes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: cffr-validate
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/r-tools
          version: ${{ env.M6E_TAG }}
          run: auto-cffr-validate
      - name: hadolint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.HADOLINT_IMAGE || 'hadolint/hadolint' }}
          version: v2.15.1
          pull: missing
          run: hadolint Dockerfile
      - name: ignorelint-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/ignorelint
          version: ${{ env.M6E_TAG }}
          run: ignorelint
      - name: jsonlint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/js-tools
          version: ${{ env.M6E_TAG }}
          run: auto-jsonlint
      - name: shellcheck
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/misc-tools
          version: ${{ env.M6E_TAG }}
          run: auto-shellcheck
      - name: yamllint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/python-tools
          version: ${{ env.M6E_TAG }}
          run: auto-yamllint
