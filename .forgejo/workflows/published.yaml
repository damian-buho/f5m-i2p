    steps:
      - name: published verdict
        run: |
          passed=0 skipped=0 failed=0
          for pair in \
            "container-is-verified=${{ needs.container-is-verified.result }}" \
            "documentation-passes-lint=${{ needs.documentation-passes-lint.result }}" \
            "image-has-sbom=${{ needs.image-has-sbom.result }}" \
            "image-is-built=${{ needs.image-is-built.result }}" \
