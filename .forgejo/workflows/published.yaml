    if: ${{ !cancelled() && needs.release-tag.result == 'success' && needs.runner-is-ready.result == 'success' && (needs.signing-is-ready.result == 'success' || (needs.signing-is-ready.result == 'skipped' && !((startsWith(github.ref, 'refs/heads/')) || (needs.release-tag.outputs.tag != '')))) && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    env:
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /app/.cache/osv
      CI_IGNORE_VULNERABILITIES: ${{ vars.CI_IGNORE_VULNERABILITIES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: clamav-scan-source
        if: vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_CLAMAV_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-clamav fs
          env: |-
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/clamav-db:/app/.cache/clamav:rw
      - name: grype-scan-source
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_GRYPE_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype
          env: |-
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/grype-db:/app/.cache/grype:rw
      - name: osv-scanner-scan-source
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_OSV_SCANNER_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=Y
          mounts: /app/data/ci-cache/osv-db:/app/.cache/osv:rw
      - name: trivy-scan-source
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true'
        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=Y
            TRIVY_CACHE_BACKEND
          mounts: /app/data/ci-cache/trivy-db:/app/.cache/trivy:rw
      - uses: forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  source-passes-lint:
