        run: .makefile/container/scripts/compose-config.sh
      - name: compose-example-check
        if: vars.CI_SKIP_SOURCE_PASSES_LINT != 'true' && vars.CI_SKIP_COMPOSE_EXAMPLE_CHECK != 'true'
        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.DOCKER_CLI_IMAGE || 'docker' }}
          version: 29.8.1-cli
          pull: missing
