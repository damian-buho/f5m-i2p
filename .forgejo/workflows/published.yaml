            "release-tag=${{ needs.release-tag.result }}" \
            "runner-is-ready=${{ needs.runner-is-ready.result }}" \
            "signing-is-ready=${{ needs.signing-is-ready.result }}" \
            "source-is-compliant=${{ needs.source-is-compliant.result }}" \
            "source-is-secure=${{ needs.source-is-secure.result }}" \
            "source-passes-lint=${{ needs.source-passes-lint.result }}"; do
            echo "verdict need=${pair%%=*} result=${pair#*=}"
            case "${pair#*=}" in
              success) passed=$((passed + 1)) ;;
              skipped) skipped=$((skipped + 1)) ;;
              *) failed=$((failed + 1)) ;;
            esac
          done
          status=success; event=goal.succeeded
          if [ "${failed}" -gt 0 ]; then
            status=failure; event=goal.failed
          elif [ "${passed}" -eq 0 ]; then
            status=skipped; event=goal.skipped
          fi
          echo "verdict goal=published status=${status} passed=${passed} skipped=${skipped} failed=${failed}"
          [ "${failed}" -eq 0 ]
