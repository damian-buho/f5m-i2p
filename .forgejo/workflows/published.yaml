        uses: projectfile/actions/run-tool@d1ad36a79e6eaffe685772795328ed92ccb05713 # v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'kiota.ch') }}
          version: ${{ env.M6E_TAG }}
          run: auto-shellcheck
