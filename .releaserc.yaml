# pf-cli-managed: yes
tagFormat: ${version}
branches:
  - name: main
    channel: latest
plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - - "@markwylde/semantic-release-gitea"
    - giteaUrl: https://kiota.ch
